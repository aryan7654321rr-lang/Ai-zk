name: NOVA-X APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build NOVA Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check NOVA project
        shell: bash
        run: |
          set -e

          if [ ! -f package.json ]; then
            echo "ERROR: package.json was not found in the repository root."
            echo "Make sure the contents of the NOVA project are uploaded,"
            echo "not the ZIP file itself."
            exit 1
          fi

          echo "NOVA project found."
          echo "Node version:"
          node --version || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build NOVA web application
        run: npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Android project
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Sync NOVA with Android
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find APK
        shell: bash
        run: |
          find android -type f -name "*.apk" -print

      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-X-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
