name: NOVA-X APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build NOVA Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate NOVA project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            printf '%s\n' '.' > nova-project-dir.txt
            exit 0
          fi

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No package.json or ZIP containing a NOVA project was found."
            exit 1
          fi

          rm -rf nova-extracted
          mkdir -p nova-extracted

          unzip -q "$ZIP_FILE" -d nova-extracted

          PROJECT_DIR=$(dirname "$(find nova-extracted -type f -name package.json -print -quit || true)")

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json was not found after extracting the ZIP."
            find nova-extracted -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          printf '%s\n' "$PROJECT_DIR" > nova-project-dir.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cat "$GITHUB_WORKSPACE/nova-project-dir.txt")"
          npm install

      - name: Build NOVA web application
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cat "$GITHUB_WORKSPACE/nova-project-dir.txt")"
          npm run build

      - name: Install Capacitor Android packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cat "$GITHUB_WORKSPACE/nova-project-dir.txt")"
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create or update Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cat "$GITHUB_WORKSPACE/nova-project-dir.txt")"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(cat "$GITHUB_WORKSPACE/nova-project-dir.txt")"

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-X-debug-APK
          path: '**/android/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
